spring:
  application:
    name: customer-service

  datasource:
    url: jdbc:postgresql://localhost:5432/nexuswealth
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html