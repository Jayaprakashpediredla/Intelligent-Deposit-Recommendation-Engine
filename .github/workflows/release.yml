name: Release and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: |
          ${{ secrets.DOCKER_USERNAME }}/intelligent-deposit-recommendation-engine
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push gateway image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/gateway/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/gateway:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push customer-service image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/customer-service/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/customer-service:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push transaction-service image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/transaction-service/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/transaction-service:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push recommendation-service image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/recommendation-service/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/recommendation-service:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push notification-service image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./docker/notification-service/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/notification-service:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_type == 'tag'

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to staging
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_STAGING }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
        ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST 'cd /app && docker-compose pull && docker-compose up -d'

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref_type == 'tag'
    environment: production

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to production
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_PROD }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
        ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST 'cd /app && docker-compose pull && docker-compose up -d'

